name: Bug
description: Something is broken. Include a red command if you have one.
labels: ["bug", "needs-discussion"]
body:
  - type: markdown
    attributes:
      value: |
        Search open issues and PRs first. Issues are not claims.
        This form applies `needs-discussion`. A claim lease comes after maintainers add `claimable`.
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
    validations:
      required: true
  - type: textarea
    id: red
    attributes:
      label: Red command
      description: Exact command that fails, or "manual / no command yet"
      placeholder: pytest tests/test_foo.py::test_bar
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: OS, language version, commit SHA
