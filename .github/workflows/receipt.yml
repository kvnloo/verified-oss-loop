name: Evidence receipt

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: receipt-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  receipt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch live PR body
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          # The pull_request event payload can lag the body: push a new SHA while
          # head_revision still names the previous commit, or edit the body after
          # synchronize. Read the live PR so receipt CI matches what reviewers see.
          gh api "repos/${REPO}/pulls/${PR}" --jq '.body // ""' > /tmp/pr-body.md
      - name: Check evidence receipt and exact head
        env:
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/check-receipt.py --file /tmp/pr-body.md --head "$HEAD"
