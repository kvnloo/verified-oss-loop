name: smoke

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fixture checks
        run: bash tests/smoke.sh
      - name: Factory runtime acceptance (offline, fake harness)
        run: python3 -m unittest discover -s tests/acceptance -v
      - name: Guards proven by revert
        run: python3 tests/acceptance/guard_revert.py
